spring:
  application:
    name: order-platform
  datasource:
    url: jdbc:postgresql://localhost:5432/orderplatform
    username: orderplatform
    password: orderplatform
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.hibernate.SQL: debug
